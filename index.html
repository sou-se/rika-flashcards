<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小学五年サイエンス　理科要点のまとめ</title>
<style>
  :root {
    --bg: #f3faf3;
    --ink: #2b2a33;
    --muted: #6f7a72;
    --card: #ffffff;
    --front: #2f9e44;
    --back: #f08c00;
    --ok: #2f9e44;
    --ng: #e03131;
    --line: #dde8dd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { -webkit-appearance: none; appearance: none; outline: none; font: inherit; cursor: pointer; border: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* 単元選択 */
  .deck-btn {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; background: var(--card); border: 2px solid var(--line);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; text-align: left;
    color: var(--ink); transition: transform .1s;
  }
  .deck-btn:active { transform: scale(.98); }
  .deck-btn .name { font-weight: bold; font-size: 1.1rem; }
  .deck-btn .info { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .deck-btn .badge { font-size: .85rem; font-weight: bold; color: var(--ok); white-space: nowrap; margin-left: 8px; }
  .deck-btn.all { border-color: var(--front); }
  .opts { display: flex; gap: 10px; justify-content: center; margin: 20px 0 8px; flex-wrap: wrap; }
  .toggle {
    background: var(--card); border: 2px solid var(--line); border-radius: 999px;
    padding: 8px 16px; font-size: .9rem; color: var(--ink);
  }
  .toggle.on { background: var(--front); border-color: var(--front); color: #fff; }
  .reset { display: block; margin: 24px auto 0; background: none; color: var(--muted); font-size: .85rem; text-decoration: underline; }

  /* カード */
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-link { background: none; color: var(--muted); font-size: .95rem; padding: 6px 0; }
  .count { font-weight: bold; color: var(--muted); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; background: var(--front); width: 0; transition: width .3s; }

  .scene { perspective: 1200px; }
  /* 表と裏を同じマスに重ねて、高いほうに合わせてカードが伸びるようにする */
  .card {
    display: grid; width: 100%; min-height: 320px;
    transform-style: preserve-3d; transition: transform .5s; cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; position: relative;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 22px; padding: 44px 20px 24px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  .face .tag {
    position: absolute; top: 14px; left: 16px; font-size: .75rem; font-weight: bold;
    padding: 4px 10px; border-radius: 99px;
  }
  .fig { width: 100%; display: flex; justify-content: center; }
  .fig:empty { display: none; }
  .fig svg { width: 100%; max-width: 360px; height: auto; }
  .front { background: var(--card); border: 3px solid var(--front); }
  .front .tag { background: #e3f5e6; color: var(--front); }
  .front .fig { margin-bottom: 14px; }
  .front .q { font-size: 1.2rem; line-height: 1.7; }
  .front .hint { color: var(--muted); font-size: .85rem; margin-top: 20px; }
  .backface { background: #fff9ef; border: 3px solid var(--back); transform: rotateY(180deg); }
  .backface .tag { background: #fff0d6; color: #c46a00; }
  .backface .fig { margin-bottom: 10px; }
  .backface .fig svg { max-width: 220px; }
  .backface .a { font-size: 1.8rem; font-weight: bold; color: #c46a00; line-height: 1.4; }
  .backface .ruby { font-size: .95rem; color: var(--muted); margin-top: 4px; }
  .backface .goro { margin-top: 14px; background: #fff0d6; color: #a85a00; border-radius: 12px; padding: 8px 14px; font-weight: bold; font-size: 1rem; }
  .backface .note { font-size: .95rem; line-height: 1.7; margin-top: 18px; color: var(--ink); text-align: left; }

  .judge { display: flex; gap: 12px; margin-top: 20px; visibility: hidden; }
  .judge.show { visibility: visible; }
  .judge button { flex: 1; padding: 18px 0; border-radius: 16px; font-size: 1.1rem; font-weight: bold; color: #fff; }
  .judge .ng { background: var(--ng); }
  .judge .ok { background: var(--ok); }
  .flip-btn { display: block; width: 100%; margin-top: 20px; padding: 18px 0; border-radius: 16px; background: var(--front); color: #fff; font-size: 1.1rem; font-weight: bold; }
  .flip-btn.hide { display: none; }

  /* 結果 */
  .result-box { background: var(--card); border-radius: 22px; padding: 28px 20px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .score { font-size: 3rem; font-weight: bold; color: var(--front); margin: 8px 0; }
  .msg { font-size: 1.1rem; margin-bottom: 4px; }
  .review { margin-top: 24px; }
  .review h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .review-item { background: var(--card); border-left: 5px solid var(--ng); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .review-item .rq { font-size: .95rem; line-height: 1.6; }
  .review-item .ra { font-weight: bold; color: #c46a00; margin-top: 4px; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .btn { padding: 16px 0; border-radius: 16px; font-size: 1.05rem; font-weight: bold; }
  .btn.primary { background: var(--ng); color: #fff; }
  .btn.secondary { background: var(--front); color: #fff; }
  .btn.plain { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 単元選択 -->
  <section id="eraScreen" class="screen active">
    <h1>🔬 小学五年サイエンス　理科要点のまとめ</h1>
    <p class="sub">勉強する単元をえらぼう</p>
    <div id="eras"></div>
  </section>

  <!-- デッキ選択 -->
  <section id="home" class="screen">
    <button class="back-link" id="eraBackBtn">← 単元をえらぶ</button>
    <h1 id="eraTitle" style="font-size:1.2rem"></h1>
    <p class="sub">カードをタップして答えを確認しよう</p>
    <div id="decks"></div>
    <div class="opts">
      <button class="toggle on" id="shuffleToggle">🔀 シャッフル</button>
      <button class="toggle" id="reverseToggle">🔁 答え→問題</button>
    </div>
    <button class="reset" id="resetBtn">覚えた記録をリセット</button>
  </section>

  <!-- カード画面 -->
  <section id="study" class="screen">
    <div class="top">
      <button class="back-link" id="quitBtn">← もどる</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="scene">
      <div class="card" id="card">
        <div class="face front">
          <span class="tag" id="frontTag"></span>
          <div class="fig" id="frontFig"></div>
          <div class="q" id="frontText"></div>
          <div class="hint">タップでうら返す</div>
        </div>
        <div class="face backface">
          <span class="tag">こたえ</span>
          <div class="fig" id="backFig"></div>
          <div class="a" id="backText"></div>
          <div class="ruby" id="backRuby"></div>
          <div class="goro" id="backGoro"></div>
          <div class="note" id="backNote"></div>
        </div>
      </div>
    </div>
    <button class="flip-btn" id="flipBtn">答えを見る</button>
    <div class="judge" id="judge">
      <button class="ng" id="ngBtn">😣 まだ</button>
      <button class="ok" id="okBtn">😊 覚えた</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="result-box">
      <div class="msg" id="resultMsg"></div>
      <div class="score" id="resultScore"></div>
      <div id="resultSub" style="color:var(--muted)"></div>
    </div>
    <div class="review" id="review"></div>
    <div class="btn-row">
      <button class="btn primary" id="retryNgBtn">😣「まだ」のカードだけもう一度</button>
      <button class="btn secondary" id="retryAllBtn">🔀 全部もう一度</button>
      <button class="btn plain" id="homeBtn">単元選択にもどる</button>
    </div>
  </section>

</div>

<script>
// ===== 図（SVG） =====
// カードに f: "図の名前" をつけると、問題の上に図が出る。
// 表と裏で同じ図を2回使うので、SVGの中では id を使わないこと。
const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Hiragino Maru Gothic ProN, Hiragino Sans, sans-serif">${body}</svg>`;
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 14}" text-anchor="${o.a || "middle"}" fill="${o.c || "#2b2a33"}" font-weight="${o.w || "bold"}">${s}</text>`;
const L = (x1, y1, x2, y2, c = "#555", w = 1.5) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
const M = (x, y, s) => `<circle cx="${x}" cy="${y}" r="13" fill="#2f9e44"/>` + T(x, y + 5, s, { c: "#fff", size: 15 });
function A(x1, y1, x2, y2, c = "#333", w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 11;
  const p = d => `${(x2 - h * Math.cos(a + d)).toFixed(1)},${(y2 - h * Math.sin(a + d)).toFixed(1)}`;
  return L(x1, y1, (x2 - h * .6 * Math.cos(a)).toFixed(1), (y2 - h * .6 * Math.sin(a)).toFixed(1), c, w)
    + `<polygon points="${x2},${y2} ${p(.45)} ${p(-.45)}" fill="${c}"/>`;
}

function dish(x, y, letter, o) {
  let s = T(x + 45, y + 14, letter, { size: 15 });
  if (o.dark) s += `<rect x="${x + 2}" y="${y + 20}" width="86" height="52" rx="4" fill="#333" fill-opacity=".18" stroke="#333" stroke-width="2.5"/>` + T(x + 45, y + 33, "暗箱", { size: 10, c: "#333" });
  if (o.cotton) s += `<rect x="${x + 9}" y="${y + 54}" width="72" height="14" fill="${o.cotton === "wet" ? "#a5d8ff" : "#fff"}" stroke="#999"/>` + T(x + 45, y + 65, o.cotton === "wet" ? "しめった綿" : "かわいた綿", { size: 9, w: "normal" });
  const sy = o.water ? y + 60 : y + 49;
  [27, 45, 63].forEach(cx => s += `<ellipse cx="${x + cx}" cy="${sy}" rx="8" ry="5.5" fill="#a0522d"/>`);
  if (o.water) s += `<rect x="${x + 8}" y="${y + 44}" width="74" height="24" fill="#74c0fc" fill-opacity=".6"/>` + T(x + 45, y + 52, "水", { size: 9, c: "#1864ab" });
  s += `<path d="M${x + 7} ${y + 40} V${y + 69} H${x + 83} V${y + 40}" fill="none" stroke="#555" stroke-width="2"/>`;
  s += T(x + 45, y + 88, o.temp, { size: 12 });
  return s;
}

const LEAF = "M150 215 C120 185 60 190 35 150 C20 120 50 95 75 100 C60 70 90 35 150 25 C210 35 240 70 225 100 C250 95 280 120 265 150 C240 190 180 185 150 215Z";

// メダカ（ローカル座標 200×90）。male=true でオスの形
function fish(male) {
  const st = `stroke="#a68a3a" stroke-width="1.3"`, fin = `fill="#f5e3a3" ${st}`;
  const body = male
    ? "M8 45 Q18 28 60 27 Q120 24 162 37 L166 41 L166 49 L162 53 Q120 64 60 63 Q18 62 8 45Z"
    : "M8 45 Q18 28 60 27 Q120 24 162 37 L166 41 L166 49 L162 53 Q120 66 86 72 Q40 78 8 45Z";
  const dorsal = male ? "M116 28 L128 8 L138 10 L133 19 L146 15 L148 31Z" : "M126 29 L140 14 L148 17 L148 32Z";
  const anal = male ? "M78 62 L150 52 L160 72 L90 82Z" : "M98 65 L150 54 L141 71Z";
  return `<path d="M163 39 L198 22 L198 68 L163 51Z" ${fin}/>`
    + `<path d="${dorsal}" ${fin}/><path d="${anal}" ${fin}/>`
    + `<path d="M62 61 L76 62 L66 80Z" ${fin}/>`
    + `<path d="${body}" fill="#f7eccb" ${st}/>`
    + [70, 86, 102, 118, 134, 150].map(x => [34, 44, 54].map(y => `<path d="M${x} ${y - 4} q5 4 0 8" stroke="#c9b37a" fill="none"/>`).join("")).join("")
    + `<ellipse cx="50" cy="45" rx="11" ry="5" transform="rotate(-10 50 45)" ${fin}/>`
    + `<path d="M38 31 Q46 45 38 59" stroke="#a68a3a" fill="none"/>`
    + `<circle cx="22" cy="40" r="5.5" fill="#fff" stroke="#333"/><circle cx="23" cy="40" r="2.6" fill="#333"/>`;
}

const FIG = {
  sprouts: svg(320, 175,
    `<rect x="0" y="130" width="320" height="45" fill="#d2b48c"/>`
    + `<path d="M88 130 C84 100 92 70 104 38" stroke="#4caf50" stroke-width="7" fill="none" stroke-linecap="round"/>`
    + `<path d="M230 130 V88" stroke="#4caf50" stroke-width="5"/>`
    + `<ellipse cx="206" cy="82" rx="27" ry="12" transform="rotate(-18 206 82)" fill="#66bb6a"/>`
    + `<ellipse cx="254" cy="82" rx="27" ry="12" transform="rotate(18 254 82)" fill="#66bb6a"/>`
    + M(90, 155, "ア") + M(230, 155, "イ")),

  kaki: svg(300, 250,
    `<ellipse cx="110" cy="125" rx="60" ry="100" fill="#fffaf0" stroke="#a0522d" stroke-width="7"/>`
    + `<path d="M110 150 C98 130 100 105 106 92 C112 108 112 132 110 150Z" fill="#e8f5e9" stroke="#555"/>`
    + `<path d="M110 150 C122 130 120 105 114 92 C108 108 108 132 110 150Z" fill="#e8f5e9" stroke="#555"/>`
    + `<rect x="107" y="150" width="6" height="40" fill="#e8f5e9" stroke="#555"/>`
    + `<path d="M106 190 L114 190 L110 208Z" fill="#e8f5e9" stroke="#555"/>`
    + L(140, 65, 215, 45) + M(232, 45, "ア")
    + L(113, 115, 215, 105) + M(232, 105, "イ")
    + L(113, 170, 215, 165) + M(232, 165, "ウ")
    + L(110, 203, 215, 220) + M(232, 220, "エ")
    + L(54, 92, 28, 60) + M(20, 48, "オ")
    + T(110, 245, "カキの種子（切ったところ）", { size: 11, w: "normal" })),

  ine: svg(300, 240,
    `<ellipse cx="110" cy="115" rx="55" ry="95" fill="#fff6d6" stroke="#b8963c" stroke-width="6"/>`
    + `<ellipse cx="138" cy="180" rx="16" ry="20" fill="#f2c94c" stroke="#8a6d1c"/>`
    + L(100, 80, 215, 60) + M(232, 60, "ア")
    + L(150, 186, 215, 196) + M(232, 196, "イ")
    + L(58, 88, 30, 60) + M(20, 48, "ウ")
    + T(110, 232, "イネの種子（切ったところ）", { size: 11, w: "normal" })),

  daizu: svg(340, 240,
    `<ellipse cx="80" cy="120" rx="50" ry="85" fill="#fff8dc" stroke="#a0522d" stroke-width="5"/>`
    + `<ellipse cx="190" cy="120" rx="50" ry="85" fill="#fff8dc" stroke="#a0522d" stroke-width="5"/>`
    + `<path d="M158 68 C148 56 154 46 166 48 C167 58 163 64 158 68Z" fill="#c5e1a5" stroke="#555"/>`
    + `<path d="M158 68 C150 88 150 108 154 124" stroke="#8d6e63" stroke-width="6" fill="none" stroke-linecap="round"/>`
    + `<path d="M154 124 L156 142" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>`
    + L(205, 112, 285, 100) + M(302, 100, "ア")
    + L(164, 54, 285, 42) + M(302, 42, "イ")
    + L(152, 100, 285, 158) + M(302, 158, "ウ")
    + L(156, 140, 285, 210) + M(302, 210, "エ")
    + T(135, 232, "ダイズの種子（2つにわったところ）", { size: 11, w: "normal" })),

  hatsuga: svg(370, 205,
    dish(5, 0, "A", { cotton: "wet", temp: "25℃" })
    + dish(95, 0, "B", { cotton: "dry", temp: "25℃" })
    + dish(185, 0, "C", { water: true, temp: "25℃" })
    + dish(275, 0, "D", { cotton: "wet", temp: "5℃" })
    + dish(50, 105, "E", { cotton: "wet", dark: true, temp: "25℃" })
    + dish(140, 105, "F", { cotton: "dry", dark: true, temp: "25℃" })
    + dish(230, 105, "G", { cotton: "wet", temp: "45℃" })),

  flask: svg(330, 210,
    `<path d="M10 110 V195 H180 V110" fill="#d0ebff" stroke="#555" stroke-width="2"/>`
    + `<path d="M80 34 L110 34 L110 72 L160 185 L30 185 L80 72Z" fill="#fff" fill-opacity=".7" stroke="#333" stroke-width="2"/>`
    + `<rect x="77" y="20" width="36" height="15" rx="2" fill="#8d6e63"/>`
    + [50, 68, 86, 104, 122, 140, 60, 80, 100, 120].map((cx, i) => `<ellipse cx="${cx}" cy="${i < 6 ? 177 : 166}" rx="9" ry="6" fill="#c8875a" stroke="#8d5a3a"/>`).join("")
    + T(95, 14, "三角フラスコ", { size: 12 }) + T(30, 128, "水", { size: 12, c: "#1864ab" })
    + `<rect x="230" y="60" width="62" height="135" rx="14" fill="#eee" stroke="#333" stroke-width="2"/>`
    + `<rect x="250" y="48" width="22" height="14" fill="#333"/>`
    + L(261, 26, 261, 160, "#c62828", 3)
    + [244, 261, 278, 252, 270].map((cx, i) => `<ellipse cx="${cx}" cy="${i < 3 ? 182 : 171}" rx="9" ry="6" fill="#c8875a" stroke="#8d5a3a"/>`).join("")
    + T(261, 18, "温度計", { size: 12 }) + T(261, 207, "まほうびん", { size: 12 })),

  shiyou: svg(330, 175,
    `<rect x="0" y="130" width="330" height="8" fill="#a1887f"/>`
    + [55, 165, 275].map((x, i) => {
      let s = `<path d="M${x} 130 V40" stroke="#9ccc65" stroke-width="5"/>`
        + `<ellipse cx="${x - 8}" cy="38" rx="10" ry="5" transform="rotate(-30 ${x - 8} 38)" fill="#7cb342"/>`
        + `<ellipse cx="${x + 8}" cy="38" rx="10" ry="5" transform="rotate(30 ${x + 8} 38)" fill="#7cb342"/>`;
      const cx = x + 22, cy = 92;
      if (i === 0) s += `<ellipse cx="${cx}" cy="${cy}" rx="22" ry="16" fill="#c8875a"/>`;
      if (i === 1) s += `<ellipse cx="${cx}" cy="${cy}" rx="22" ry="16" fill="none" stroke="#888" stroke-dasharray="4 3"/>`
        + `<path d="M${cx} ${cy - 16} A22 16 0 0 0 ${cx} ${cy + 16}Z" fill="#c8875a"/>`;
      if (i === 2) s += `<ellipse cx="${cx}" cy="${cy}" rx="22" ry="16" fill="none" stroke="#888" stroke-dasharray="4 3"/>`
        + `<ellipse cx="${x + 5}" cy="${cy}" rx="5" ry="9" fill="#c8875a"/>`;
      return s + T(x + 10, 162, ["①そのまま", "②半分切る", "③ほとんど切る"][i], { size: 12 });
    }).join("")),

  omosa: svg(320, 205,
    A(40, 170, 305, 170, "#333", 2) + A(40, 170, 40, 12, "#333", 2)
    + T(22, 95, "重", { size: 13 }) + T(22, 112, "さ", { size: 13 }) + T(305, 160, "日数", { size: 12, a: "end" })
    + `<path d="M40 60 C80 115 140 150 190 140 C235 130 270 90 300 30" stroke="#2f9e44" stroke-width="3" fill="none"/>`
    + `<circle cx="92" cy="110" r="5" fill="#333"/>` + `<line x1="92" y1="110" x2="92" y2="170" stroke="#333" stroke-dasharray="4 3"/>`
    + T(92, 192, "発芽", { size: 13 })),

  fuiri_before: svg(310, 235,
    `<path d="M150 215 V232" stroke="#2e7d32" stroke-width="4"/>`
    + `<path d="${LEAF}" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>`
    + `<ellipse cx="55" cy="140" rx="22" ry="14" fill="#f1f8e9"/>`
    + `<ellipse cx="245" cy="140" rx="22" ry="14" fill="#f1f8e9"/>`
    + `<rect x="85" y="110" width="130" height="26" fill="#bdbdbd" stroke="#757575"/>`
    + L(45, 150, 22, 200) + M(20, 212, "ア")
    + L(255, 150, 280, 200) + M(288, 212, "ア")
    + L(200, 112, 270, 60) + M(284, 52, "P")),

  // ヨウ素液につける前の葉に A〜C の記号だけをつけたもの（色で答えがばれないように）
  fuiri_abc: svg(310, 235,
    `<path d="M150 215 V232" stroke="#2e7d32" stroke-width="4"/>`
    + `<path d="${LEAF}" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>`

// ===== 状態 =====
const STORE_KEY = "rika_flashcards";
let era = null;
let DECKS = [];
let mastered = loadMastered();
let shuffle = true;
let reverse = false;
let currentDeckIds = [];
let queue = [];
let idx = 0;
let ngList = [];
let okCount = 0;

function loadMastered() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveMastered() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(mastered)); } catch (e) {}
}
function cardKey(deckId, i, eraId) { return (eraId || era.id) + ":" + deckId + ":" + i; }

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

// ===== 単元選択 =====
function renderEras() {
  const box = $("eras");
  box.innerHTML = "";
  ERAS.forEach(e => {
    const total = e.decks.reduce((s, d) => s + d.cards.length, 0);
    const done = e.decks.reduce((s, d) => s + d.cards.filter((_, i) => mastered[cardKey(d.id, i, e.id)]).length, 0);
    const b = document.createElement("button");
    b.className = "deck-btn";
    const badge = done === total ? "✅ 全部覚えた" : `覚えた ${done}/${total}`;
    b.innerHTML = `<div><div class="name">${e.name}</div><div class="info">${total}枚・${e.source}</div></div><div class="badge">${badge}</div>`;
    b.onclick = () => selectEra(e);
    box.appendChild(b);
  });
}
function selectEra(e) {
  era = e;
  DECKS = e.decks;
  $("eraTitle").textContent = e.name;
  renderHome();
  show("home");
}

// ===== デッキ選択 =====
function renderHome() {
  const box = $("decks");
  box.innerHTML = "";
  const allCount = DECKS.reduce((s, d) => s + d.cards.length, 0);
  const allDone = DECKS.reduce((s, d) => s + d.cards.filter((_, i) => mastered[cardKey(d.id, i)]).length, 0);
  box.appendChild(deckButton("🌟 ぜんぶ", allCount + "枚", allDone, allCount, DECKS.map(d => d.id), true));
  DECKS.forEach(d => {
    const done = d.cards.filter((_, i) => mastered[cardKey(d.id, i)]).length;
    box.appendChild(deckButton(`${d.no}　${d.title}`, `${d.cards.length}枚・${d.page}`, done, d.cards.length, [d.id]));
  });
}
function deckButton(name, info, done, total, ids, isAll) {
  const b = document.createElement("button");
  b.className = "deck-btn" + (isAll ? " all" : "");
  const badge = done === total ? "✅ 全部覚えた" : `覚えた ${done}/${total}`;
  b.innerHTML = `<div><div class="name">${name}</div><div class="info">${info}</div></div><div class="badge">${badge}</div>`;
  b.onclick = () => start(ids);
  return b;
}

// ===== 学習 =====
function start(deckIds, onlyCards) {
  currentDeckIds = deckIds;
  queue = onlyCards || deckIds.flatMap(id => {
    const d = DECKS.find(x => x.id === id);
    return d.cards.map((c, i) => ({ ...c, key: cardKey(id, i), deck: `${era.no}-${d.no} ${d.title}（${d.page}）` }));
  });
  if (shuffle) queue = shuffled(queue);
  idx = 0; ngList = []; okCount = 0;
  show("study");
  renderCard();
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function renderCard() {
  const c = queue[idx];
  const card = $("card");
  card.classList.remove("flipped");
  $("judge").classList.remove("show");
  $("flipBtn").classList.remove("hide");
  $("count").textContent = `${idx + 1} / ${queue.length}`;
  $("barFill").style.width = (idx / queue.length * 100) + "%";
  $("frontTag").textContent = c.deck;

  // 図つき・長い答えのカードは逆向きにしない
  const useReverse = reverse && !c.long && !c.f;
  // うら返しアニメ中に中身が見えないよう少し待って差しかえ
  setTimeout(() => {
    $("frontFig").innerHTML = c.f ? FIG[c.f] : "";
    $("backFig").innerHTML = FIG[c.b || c.f] || "";
    $("frontText").innerHTML = esc(useReverse ? c.a : c.q).replace(/\n/g, "<br>");
    $("frontText").style.fontSize = useReverse ? "2rem" : "";
    $("frontText").style.fontWeight = useReverse ? "bold" : "";
    $("backText").innerHTML = esc(useReverse ? c.q : c.a).replace(/\n/g, "<br>");
    $("backText").style.fontSize = (useReverse || c.long) ? "1.15rem" : "";
    $("backRuby").textContent = useReverse ? "" : (c.r || "");
    $("backNote").textContent = c.n ? "📖 " + c.n : "";
    $("backGoro").textContent = c.g ? "🎵 語呂：" + c.g : "";
    $("backGoro").style.display = c.g ? "" : "none";
    if (useReverse) $("backNote").textContent = "（" + c.a + (c.r ? "：" + c.r : "") + "）  📖 " + c.n;
  }, card.classList.contains("flipped") ? 250 : 0);
}
function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}
function flip() {
  const card = $("card");
  card.classList.toggle("flipped");
  if (card.classList.contains("flipped")) {
    $("judge").classList.add("show");
    $("flipBtn").classList.add("hide");
  }
}
function judge(ok) {
  const c = queue[idx];
  if (ok) { okCount++; mastered[c.key] = true; }
  else { ngList.push(c); delete mastered[c.key]; }
  saveMastered();
  idx++;
  if (idx >= queue.length) showResult();
  else {
    $("card").classList.remove("flipped");
    setTimeout(renderCard, 250);
  }
}

// ===== 結果 =====
function showResult() {
  const total = queue.length;
  const rate = Math.round(okCount / total * 100);
  $("resultScore").textContent = `${okCount} / ${total}`;
  $("resultSub").textContent = `覚えた率 ${rate}%`;
  $("resultMsg").textContent =
    rate === 100 ? "🎉 パーフェクト！すごい！" :
    rate >= 80 ? "👏 よくできました！あと少し！" :
    rate >= 50 ? "💪 いい調子！「まだ」をもう一度やろう" :
    "📚 くり返して覚えよう！";
  const rv = $("review");
  if (ngList.length) {
    rv.innerHTML = "<h2>😣 まだのカード</h2>" + ngList.map(c =>
      `<div class="review-item"><div style="font-size:.75rem;color:var(--muted)">${esc(c.deck)}</div><div class="rq">${esc(c.q).replace(/\n/g, "<br>")}</div><div class="ra">→ ${esc(c.a)}</div>${c.g ? `<div style="color:#a85a00;font-size:.9rem;margin-top:2px">🎵 ${esc(c.g)}</div>` : ""}</div>`
    ).join("");
  } else rv.innerHTML = "";
  $("retryNgBtn").style.display = ngList.length ? "" : "none";
  show("result");
}

// ===== イベント =====
$("card").onclick = flip;
$("flipBtn").onclick = flip;
$("okBtn").onclick = () => judge(true);
$("ngBtn").onclick = () => judge(false);
$("quitBtn").onclick = () => { renderHome(); show("home"); };
$("homeBtn").onclick = () => { renderHome(); show("home"); };
$("retryAllBtn").onclick = () => start(currentDeckIds);
$("retryNgBtn").onclick = () => start(currentDeckIds, ngList.slice());
$("shuffleToggle").onclick = e => { shuffle = !shuffle; e.currentTarget.classList.toggle("on", shuffle); };
$("reverseToggle").onclick = e => { reverse = !reverse; e.currentTarget.classList.toggle("on", reverse); };
$("eraBackBtn").onclick = () => { renderEras(); show("eraScreen"); };
$("resetBtn").onclick = () => {
  if (!confirm(era.name + "の覚えた記録をリセットしますか？")) return;
  Object.keys(mastered).forEach(k => { if (k.startsWith(era.id + ":")) delete mastered[k]; });
  saveMastered();
  renderHome();
};

renderEras();
</script>
</body>
</html>
